services:
  tradeflow:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tradeflow

    restart: unless-stopped

    env_file:
      - .env.production

    networks:
      - proxy
      - backend

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true

  backend:
    external: true