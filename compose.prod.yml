services:
  tradeflow:
    image: tradeflow:latest

    build:
      context: .
      dockerfile: Dockerfile

    container_name: tradeflow

    restart: unless-stopped

    env_file:
      - .env.production

    networks:
      - proxy
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    working_dir: /app

    volumes:
      - .:/app

    env_file:
      - .env.production

    command: >
      command: npm run db:migrate

    networks:
      - backend

networks:
  proxy:
    external: true

  backend:
    external: true